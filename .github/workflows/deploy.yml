name: Deploy Pages

# Builds the Vite apps in ./akamai and ./projects/compromised-identity and
# publishes the whole portfolio site (all existing static files unchanged) with
# the built apps served at https://<user>.github.io/<repo>/akamai/ and
# https://<user>.github.io/<repo>/projects/compromised-identity/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            akamai/package-lock.json
            projects/compromised-identity/package-lock.json

      # Build the Vite app (source of truth lives in ./akamai)
      - name: Build akamai app
        working-directory: akamai
        run: |
          npm ci
          npm run build

      # Build the Compromised Identity Vite app (source lives in ./projects/compromised-identity)
      - name: Build compromised-identity app
        working-directory: projects/compromised-identity
        run: |
          npm ci
          npm run build

      # Assemble the site: copy the entire repo as-is, then replace the app
      # SOURCE folders with their built output so raw .tsx is never served.
      - name: Assemble _site
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='/akamai' \
            --exclude='/projects/compromised-identity' \
            ./ _site/
          mkdir -p _site/akamai
          cp -r akamai/dist/* _site/akamai/
          mkdir -p _site/projects/compromised-identity
          cp -r projects/compromised-identity/dist/* _site/projects/compromised-identity/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
